{{- $desc := .Description | default site.Params.description -}}
{{- $title := cond .IsHome site.Title (printf "%s · %s" .Title site.Title) -}}
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/social-card.jpg" | absURL }}">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $desc }}">
<meta name="twitter:image" content="{{ "images/social-card.jpg" | absURL }}">
{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Rivelin Valley Allotment Society",
  "alternateName": "RVAS",
  "url": {{ site.BaseURL | jsonify }},
  "logo": {{ "images/logo-icon.png" | absURL | jsonify }},
  "email": "rvascontact@gmail.com",
  "foundingDate": "1902",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Roscoe Plantation Allotments, Rivelin Valley Road",
    "addressLocality": "Sheffield",
    "addressRegion": "South Yorkshire",
    "addressCountry": "GB"
  },
  "description": {{ site.Params.description | jsonify }}
}
</script>
{{- end }}
