{{ define "main" }}
<article class="page">
  <div class="wrap wrap-narrow">
    <div class="paper">
      <header class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </div>
  </div>
</article>
{{ end }}
