{{ define "main" }}
<article class="page">
  <div class="wrap wrap-narrow">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    <p class="backlink"><a href="{{ "news/" | relURL }}">← All news</a></p>
  </div>
</article>
{{ end }}
